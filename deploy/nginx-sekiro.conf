# sekiro-go 反代示例（Nginx）
# 用法：拷贝到 /etc/nginx/conf.d/ 或 include 进主配置
# 证书路径按实际调整；可用 Let's Encrypt（certbot --nginx 自动配置）

server {
    listen 443 ssl;
    http2 on;
    server_name sekiro.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- 可选：/op 监控页访问控制（页面无鉴权，公网建议开启）----
    # 方式一：IP 白名单
    # location ^~ /op {
    #     allow 10.0.0.0/8;
    #     allow 192.168.0.0/16;
    #     deny all;
    #     proxy_pass http://sekiro_backend;
    #     include /etc/nginx/conf.d/nginx-sekiro-ws.inc;  # 或复制下方 proxy 参数
    # }
    # 方式二：Basic Auth（生成：htpasswd -bc /etc/nginx/.htpasswd admin）
    # location ^~ /op {
    #     auth_basic "sekiro op";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://sekiro_backend;
    # }

    location / {
        proxy_pass http://127.0.0.1:5612;

        # WebSocket 升级必需
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WS 长连接：读/发超时调大（默认 60s 会掐空闲连接）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 可选：http 跳转 https
server {
    listen 80;
    server_name sekiro.example.com;
    return 301 https://$host$request_uri;
}
