# sekiro-go 反代示例（Nginx）
# 用法：拷贝到 /etc/nginx/conf.d/ 或 include 进主配置
# 证书路径按实际调整；可用 Let's Encrypt（certbot --nginx 自动配置）
#
# 上游连接池说明：
#   - keepalive 的数字是「每个 nginx worker 保留的空闲连接数」，不是全局总数；
#   - 普通 HTTP 必须发送空的 Connection 头，nginx 才会把连接放回池中复用；
#   - WebSocket 仍通过 $connection_upgrade 发送 Connection: upgrade，两者不能写死。

upstream sekiro_backend {
    server 127.0.0.1:5612;

    # nginx → sekiro 的 HTTP/1.1 长连接池：
    # 建议 32–128，按 worker 数和后端 QPS 调整，不是越大越好。
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# 只有真正的 WebSocket 握手才发送 Upgrade/Connection: upgrade；
# 普通 HTTP 使用空 Connection 头，保证 upstream keepalive 生效。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl;
    http2 on;
    server_name sekiro.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- /op 监控页可选访问控制（页面无鉴权，公网建议开启）----
    # 直接取消下方 location /op 内的对应注释即可；不要另建重复 location，
    # nginx 不允许同一 server 内出现两个相同的 location。

    location / {
        proxy_pass http://sekiro_backend;

        # HTTP/1.1 是 upstream keepalive 的前提。
        # 普通请求：$connection_upgrade 为空 → 连接可回池复用；
        # WS 握手：$connection_upgrade=upgrade → 正常升级。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WS 长连接：读/发超时调大（默认 60s 会掐空闲连接）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 让内核在这个 upstream socket 上启 TCP keepalive，及时发现死连接。
        proxy_socket_keepalive on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /op 是普通 HTTP 页面/API，不参与 WebSocket 升级；同样复用 upstream 连接。
    location ^~ /op {
        # ---- 访问控制二选一（默认关闭）----
        # 方式一：IP 白名单
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;
        # 方式二：Basic Auth（生成：htpasswd -bc /etc/nginx/.htpasswd admin）
        # auth_basic "sekiro op";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        access_log /var/log/nginx/access.log slim;
        proxy_pass http://sekiro_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 可选：http 跳转 https
server {
    listen 80;
    server_name sekiro.example.com;
    return 301 https://$host$request_uri;
}
