# 自动发布：推送 v* 标签时，全平台构建 → 冒烟测试 → 创建 GitHub Release
# 并上传 6 个产物与 SHA256SUMS.txt（产物命名与 release/README.md 清单一致）；
# 同时构建多架构 Docker 镜像发布到 GHCR（ghcr.io/<owner>/<repo>）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CGO_ENABLED: "0"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum

      # 发布前先跑全量测试（含黄金向量对拍与 E2E），失败则中止发布
      - name: Test
        run: go test ./...

      - name: Build all platforms
        run: |
          LDFLAGS="-s -w"
          build() { # build <os> <arch> <out>
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" \
              -o "../dist/$3" ./cmd/sekiro
          }
          build linux   amd64 sekiro-linux-amd64
          build linux   arm64 sekiro-linux-arm64
          build windows amd64 sekiro-windows-amd64.exe
          build darwin  arm64 sekiro-darwin-arm64
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o ../dist/loadtest-linux-amd64 ./tools/loadtest
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o ../dist/loadtest-windows-amd64.exe ./tools/loadtest

      - name: Smoke test (linux-amd64 binary, self-check)
        run: |
          ../dist/sekiro-linux-amd64 -port 5612 &
          SRV=$!
          sleep 2
          code=$(curl -sf -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:5612/business/groupList")
          [ "$code" = "200" ] || { echo "groupList http=$code"; exit 1; }
          kill $SRV

      - name: Checksums
        working-directory: dist
        run: sha256sum sekiro-* loadtest-* > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sekiro-linux-amd64
            dist/sekiro-linux-arm64
            dist/sekiro-windows-amd64.exe
            dist/sekiro-darwin-arm64
            dist/loadtest-linux-amd64
            dist/loadtest-windows-amd64.exe
            dist/SHA256SUMS.txt

      # ---- Docker 镜像 → GHCR（Packages）----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./go
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
