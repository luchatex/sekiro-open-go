# sekiro-go 服务端编排
# 用法（WSL2 / Docker Desktop）：
#   docker compose up -d --build     # 构建并后台启动
#   docker compose logs -f sekiro    # 跟踪日志（JSON 格式）
#   docker compose ps                # 查看状态/健康度
#   docker compose down              # 停止并移除
#
# 端口调整：改 .env 或环境变量 SEKIRO_HTTP_PORT（宿主机侧），容器内固定 5612
# 数据持久化：服务端无状态（注册连接与路由在内存），无需挂载卷

name: sekiro-go

services:
  sekiro:
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        # 国内网络默认走 goproxy.cn；海外可改 https://proxy.golang.org,direct
        GOPROXY: https://goproxy.cn,direct
    image: sekiro-go:latest
    container_name: sekiro-go
    restart: unless-stopped
    ports:
      # 二进制通道（client/invoker）与 HTTP API/WebSocket 同端口多路复用
      - "${SEKIRO_HTTP_PORT:-5612}:5612"
    environment:
      SEKIRO_PORT: 5612
      # 调试模式（对齐原版 sekiro.localDebug），生产保持 false
      SEKIRO_LOCAL_DEBUG: "false"
      # 日志级别：生产可用 warn 关闭逐笔调用日志（调用记录仍可在 /op 查看）
      SEKIRO_LOG_LEVEL: "${SEKIRO_LOG_LEVEL:-info}"
      # 公网不需要监控页时可设为 true（关闭 /op 与 /op/api/*）
      SEKIRO_OP_DISABLE: "${SEKIRO_OP_DISABLE:-false}"
      # /op 监控路径密码保护：宿主机 .env 定义 OP_PASSWORD 后启用
      # （未定义则不启用鉴权；连续登录失败 3 次锁定来源 IP 2 分钟）
      SEKIRO_OP_PASSWORD: "${OP_PASSWORD:-}"
      # Go runtime 软内存目标：接近该值时 GC 更积极，但不阻止继续分配。
      # 只作为 4GB 容器硬限制前的缓冲，不是泄漏修复；按容器限制的约 75% 设置。
      GOMEMLIMIT: "${GOMEMLIMIT:-3GiB}"
      # 先保持默认 100；若无泄漏且 CPU 有余量，才考虑 75/50 换取更低 RSS。
      GOGC: "${GOGC:-100}"
      TZ: Asia/Shanghai
    # 宿主机保护：软限制无法阻止 OOM，硬限制用于防止异常进程拖垮整机。
    # 先用修复版重启观察实际峰值，再按需通过 .env 调整；禁止内存 swap 兜底。
    mem_limit: "${SEKIRO_MEM_LIMIT:-4g}"
    memswap_limit: "${SEKIRO_MEM_LIMIT:-4g}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5612/business/groupList"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # 日志轮转已在编排层强制生效：单个文件 50MB，最多 3 个，总上限约 150MB。
    # 若使用 docker run 而非 compose，必须显式传对应 --log-opt，否则 json-file 无上限。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
