# sekiro-go 服务端编排
# 用法（WSL2 / Docker Desktop）：
#   docker compose up -d --build     # 构建并后台启动
#   docker compose logs -f sekiro    # 跟踪日志（JSON 格式）
#   docker compose ps                # 查看状态/健康度
#   docker compose down              # 停止并移除
#
# 端口调整：改 .env 或环境变量 SEKIRO_HTTP_PORT（宿主机侧），容器内固定 5612
# 数据持久化：服务端无状态（注册连接与路由在内存），无需挂载卷

name: sekiro-go

services:
  sekiro:
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        # 国内网络默认走 goproxy.cn；海外可改 https://proxy.golang.org,direct
        GOPROXY: https://goproxy.cn,direct
    image: sekiro-go:latest
    container_name: sekiro-go
    restart: unless-stopped
    ports:
      # 二进制通道（client/invoker）与 HTTP API/WebSocket 同端口多路复用
      - "${SEKIRO_HTTP_PORT:-5612}:5612"
    environment:
      SEKIRO_PORT: 5612
      # 调试模式（对齐原版 sekiro.localDebug），生产保持 false
      SEKIRO_LOCAL_DEBUG: "false"
      # /op 监控路径密码保护：宿主机 .env 定义 OP_PASSWORD 后启用
      # （未定义则不启用鉴权；连续登录失败 3 次锁定来源 IP 2 分钟）
      SEKIRO_OP_PASSWORD: "${OP_PASSWORD:-}"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5612/business/groupList"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    # 资源限制按需放开：
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 512M
